[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "PTO"
version = "0.2"
description = "Program Trace Optimisation: universal metaheuristic optimisation made easy"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Alberto Moraglio", email = "albmor@gmail.com" },
    { name = "James McDermott", email = "jamesmichaelmcdermott@gmail.com" },
]
requires-python = ">=3.10"
# The core library (run, rnd and the standard solvers) uses only the standard library.
dependencies = []

[project.optional-dependencies]
# some example problems (assignment, grammatical_evolution, neural_network, as_classes)
examples = ["numpy"]
# landscape analysis: pto.solvers.correlogram and correlogram_walks
landscape = ["numpy", "scipy", "matplotlib", "scikit-gstat"]
# Jupyter GUI and trace-tree visualisation (trace trees also need the Graphviz binaries)
gui = ["ipywidgets", "ipython", "matplotlib", "graphviz"]
all = ["PTO[examples,landscape,gui]"]
dev = ["PTO[all]", "coverage"]

[project.urls]
Homepage = "https://github.com/Program-Trace-Optimisation/PTO"

[tool.setuptools.packages.find]
include = ["pto*"]
